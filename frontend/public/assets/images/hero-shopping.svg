<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#F8F9FA"/>
  
  <!-- Shopping cart -->
  <g transform="translate(150, 80)">
    <rect x="10" y="30" width="80" height="60" rx="5" fill="#FF6B35" opacity="0.1"/>
    <circle cx="25" cy="105" r="8" fill="#FF6B35"/>
    <circle cx="75" cy="105" r="8" fill="#FF6B35"/>
    <path d="M10 30L15 45H85L90 30" stroke="#FF6B35" stroke-width="3" fill="none"/>
    <path d="M15 45L20 75H80L85 45" stroke="#FF6B35" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Products floating around -->
  <circle cx="80" cy="50" r="20" fill="#4ECDC4" opacity="0.7"/>
  <circle cx="320" cy="70" r="15" fill="#45B7D1" opacity="0.7"/>
  <circle cx="60" cy="200" r="18" fill="#96CEB4" opacity="0.7"/>
  <circle cx="340" cy="220" r="22" fill="#FFEAA7" opacity="0.7"/>
  
  <!-- Text -->
  <text x="200" y="220" text-anchor="middle" fill="#6C757D" font-size="16" font-family="Arial, sans-serif">Comparando precios...</text>
  <text x="200" y="240" text-anchor="middle" fill="#ADB5BD" font-size="12" font-family="Arial, sans-serif">Ahorrando dinero</text>
</svg>