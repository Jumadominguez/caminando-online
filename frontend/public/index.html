<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caminando Online v2</title>
  <link rel="icon" href="assets/images/caminando-Favicon.png" type="image/png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <!-- Fonts para logo textual -->
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:ital@1&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header recreado desde backup -->
  <header class="banner-superior">
    <div class="logo-textual">
        <div class="logo-container">
          <img src="assets/images/Caminando-logo.png" alt="Logo Caminando Online" class="logo-caminando" />
        </div>
        <div class="logo-textual-wrapper">
            <div class="logo-caminando-textual-wrapper">
                <span class="logo-caminando-text">Caminando</span>
            </div>
            <div class="logo-online-textual-wrapper">
                <span class="logo-online-text">.Online</span>
            </div>
        </div>
    </div>
    
    <nav>
      <ul>
        <li><a href="#perfil" class="nav-auth-login">Mi Perfil</a></li>
        <li><a href="#registro" class="nav-auth-registro"><span>Registrarse</span></a></li>
      </ul>
    </nav>
  </header>

  <main id="app-container">
    <!-- Toda la aplicación se genera dinámicamente aquí -->

    <!-- Aquí van las secciones principales -->
    <section id="seccion-supermercados" class="main-section">
      <div class="container">
        <h2>1. Seleccioná tus Supermercados</h2>
        <p>Elegí los supermercados donde querés comparar precios.</p>
      </div>
    </section>

    <section id="seccion-productos" class="main-section">
      <div class="container">
        <h2>2. Elegí tus Productos</h2>
        <p>Buscá y agregá los productos que necesitás.</p>
      </div>
    </section>

    <section id="seccion-comparacion" class="main-section">
      <div class="container">
        <h2>3. Comparación de Precios</h2>
        <p>Revisá tu lista y decidí dónde comprar.</p>
      </div>
    </section>
  </main>

  <!-- El footer se carga dinámicamente mediante footer-manager.js -->

  <!-- Scripts Modularizados -->
  <!-- Footer Manager - DEBE cargarse PRIMERO para insertar el footer dinámicamente -->
  <script src="assets/js/components/footer-manager.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
